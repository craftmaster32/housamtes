<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />

    <title>HouseMates</title>
    <meta name="description" content="Shared household management" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Favicon + home-screen icon (the Housemates house mark, no wordmark).
         apple-touch-icon is what iOS Safari uses for "Add to Home Screen". -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="HouseMates" />

    <style>
      /*
        App height = the actually-visible viewport, measured in JS by the inline
        <head> script below and published as --app-height.

        History: this used to be plain `height: 100%`, which iOS Safari resolves
        correctly and worked fine. It was later switched to `100dvh` so the app
        would track the screen edge as the toolbars move — but iOS Safari
        miscomputes dvh/vh on the FIRST paint of a freshly opened page and, with
        nothing to scroll on the welcome screen, never recalculates it, so the
        app came up short and the dark page background showed as a band under the
        card until you refreshed.

        The JS measurement gives a correct pixel height from the very first frame
        and keeps tracking the screen as the toolbars move — the tracking dvh was
        meant to provide, without its first-paint bug. dvh is deliberately not
        used anywhere here: the fallback is `100%` (the proven-good value), so if
        the script somehow never runs the app still fills the screen the old way.
      */
      html, body, #root {
        height: var(--app-height, 100%);
        min-height: var(--app-height, 100%);
        width: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
      }

      [data-testid="bottom-tab-bar"] {
        position: fixed !important;
        left: 0 !important;
        right: 0 !important;
        bottom: 0 !important;
        z-index: 20 !important;
        width: 100% !important;
        padding-bottom: 12px !important;
        padding-bottom: max(12px, env(safe-area-inset-bottom)) !important;
      }

      /* Prevent flash of unstyled content */
      body {
        background-color: #F8F6F3;
      }
    </style>

    <script>
      // Keep --app-height in sync with the actually-visible viewport. Runs here
      // in <head>, before the app bundle, so #root has a correct pixel height on
      // the very first paint — fixing iOS Safari's first-load 100dvh bug (see
      // the note in the <style> above). visualViewport reports the area left
      // once the toolbars/keyboard are on screen; innerHeight is the fallback.
      (function () {
        function setAppHeight() {
          var h = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
          if (h > 0) {
            document.documentElement.style.setProperty('--app-height', Math.round(h) + 'px');
          }
        }
        setAppHeight();
        // Re-measure as the browser settles on a cold load (the URL bar animates
        // over the first few hundred ms) and on every later viewport change.
        window.requestAnimationFrame(setAppHeight);
        window.setTimeout(setAppHeight, 300);
        window.addEventListener('resize', setAppHeight);
        window.addEventListener('orientationchange', setAppHeight);
        window.addEventListener('pageshow', setAppHeight);
        if (window.visualViewport) {
          window.visualViewport.addEventListener('resize', setAppHeight);
          window.visualViewport.addEventListener('scroll', setAppHeight);
        }
      })();
    </script>

    <%- helmet.title %>
    <%- helmet.meta %>
    <%- helmet.link %>
    <%- helmet.style %>
    <%- helmet.script %>
  </head>
  <body>
    <div id="root"><%- appHtml %></div>
    <%- helmet.bodyAttributes %>
    <%- scripts %>
  </body>
</html>
