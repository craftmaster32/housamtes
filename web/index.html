<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />

    <title>HouseMates</title>
    <meta name="description" content="Shared household management" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Favicon + home-screen icon (the Housemates house mark, no wordmark).
         apple-touch-icon is what iOS Safari uses for "Add to Home Screen". -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="HouseMates" />

    <style>
      html, body, #root {
        height: 100%;
        min-height: 100%;
        width: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
      }

      @supports (height: 100dvh) {
        html, body, #root {
          height: 100dvh;
          min-height: 100dvh;
        }
      }

      /*
        JS-measured exact viewport height (set by the inline script below).
        iOS Safari miscomputes 100dvh/100vh on the FIRST paint of a freshly
        opened page and — with nothing to scroll here — never recalculates it,
        so the app came up short of the screen with the dark body colour showing
        as a band under the card until you refreshed. Measuring the visible
        viewport in JS gives a correct height from the first frame; this rule
        wins over the dvh rule above (same specificity, declared later) and
        falls back to 100dvh before the script runs / where --app-height is
        unset. On browsers without dvh the fallback is invalid, so the 100%
        rule above still applies.
      */
      html, body, #root {
        height: var(--app-height, 100dvh);
        min-height: var(--app-height, 100dvh);
      }

      [data-testid="bottom-tab-bar"] {
        position: fixed !important;
        left: 0 !important;
        right: 0 !important;
        bottom: 0 !important;
        z-index: 20 !important;
        width: 100% !important;
        padding-bottom: 12px !important;
        padding-bottom: max(12px, env(safe-area-inset-bottom)) !important;
      }

      /* Prevent flash of unstyled content */
      body {
        background-color: #F8F6F3;
      }
    </style>

    <script>
      // Keep --app-height in sync with the actually-visible viewport. Runs here
      // in <head>, before the app bundle, so #root has a correct pixel height on
      // the very first paint — fixing iOS Safari's first-load 100dvh bug (see
      // the note in the <style> above). visualViewport reports the area left
      // once the toolbars/keyboard are on screen; innerHeight is the fallback.
      (function () {
        function setAppHeight() {
          var h = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
          if (h > 0) {
            document.documentElement.style.setProperty('--app-height', Math.round(h) + 'px');
          }
        }
        setAppHeight();
        // Re-measure as the browser settles on a cold load (the URL bar animates
        // over the first few hundred ms) and on every later viewport change.
        window.requestAnimationFrame(setAppHeight);
        window.setTimeout(setAppHeight, 300);
        window.addEventListener('resize', setAppHeight);
        window.addEventListener('orientationchange', setAppHeight);
        window.addEventListener('pageshow', setAppHeight);
        if (window.visualViewport) {
          window.visualViewport.addEventListener('resize', setAppHeight);
          window.visualViewport.addEventListener('scroll', setAppHeight);
        }
      })();
    </script>

    <%- helmet.title %>
    <%- helmet.meta %>
    <%- helmet.link %>
    <%- helmet.style %>
    <%- helmet.script %>
  </head>
  <body>
    <div id="root"><%- appHtml %></div>
    <%- helmet.bodyAttributes %>
    <%- scripts %>
  </body>
</html>
