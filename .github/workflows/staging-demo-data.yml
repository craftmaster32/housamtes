name: Staging demo data

# Fills the TEST house on the staging database with six months of demo activity
# by its existing members (supabase/demo/staging-demo.sql), so the preview's
# pages have something to show. Same connection as "Staging DB Push"; never
# the live app. The SQL only runs once (it skips if the demo data is there).
on:
  push:
    branches:
      - feature/app-redesign
    paths:
      - 'supabase/demo/**'
      - '.github/workflows/staging-demo-data.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-demo-data
  cancel-in-progress: false

jobs:
  demo-data:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: '2.15.8'

      - name: Link staging project
        run: supabase link --project-ref ${{ secrets.SUPABASE_STAGING_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_STAGING_DB_PASSWORD }}

      - name: Add the demo activity
        run: |
          # Safety: only ever the test project.
          if [ "$REF" != "tcwhpelylmbafagliors" ]; then
            echo "Refusing: the linked project is not the staging one" >&2
            exit 1
          fi
          if [ ! -s supabase/.temp/pooler-url ]; then
            echo "No database address after linking" >&2
            exit 1
          fi
          # The shared pooler needs the user as "postgres.<project ref>".
          DB_URL=$(cat supabase/.temp/pooler-url)
          case "$DB_URL" in
            *"postgres.$REF@"*) ;;
            *) DB_URL="${DB_URL/postgres@/postgres.$REF@}" ;;
          esac
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/demo/staging-demo.sql
        env:
          REF: ${{ secrets.SUPABASE_STAGING_PROJECT_REF }}
          PGPASSWORD: ${{ secrets.SUPABASE_STAGING_DB_PASSWORD }}
