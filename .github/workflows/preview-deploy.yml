name: Preview deploy

# Publishes a throwaway Vercel *preview* deployment for this design branch so the
# app can be tried on a real URL before it merges. Uses the same secrets as the
# post-merge production deploy, but never passes --prod, so the live
# housemates-five.vercel.app site is untouched.

on:
  push:
    branches: [claude/design-v2-app-implementation-wc1fr3]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy preview to Vercel
        id: deploy
        env:
          VERCEL_PREVIEW: '1'
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_PROJECT_ID: ${{ secrets.EXPO_PUBLIC_PROJECT_ID }}
          EXPO_PUBLIC_VAPID_PUBLIC_KEY: ${{ secrets.EXPO_PUBLIC_VAPID_PUBLIC_KEY }}
          EXPO_PUBLIC_SENTRY_DSN: ${{ secrets.EXPO_PUBLIC_SENTRY_DSN }}
        run: npm run deploy

      - name: Comment preview URL on the PR
        if: steps.deploy.outputs.preview_url != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          URL: ${{ steps.deploy.outputs.preview_url }}
        run: |
          pr=$(gh pr list --head "${GITHUB_REF_NAME}" --json number --jq '.[0].number' --repo "${GITHUB_REPOSITORY}")
          if [ -n "$pr" ]; then
            gh pr comment "$pr" --repo "${GITHUB_REPOSITORY}" --body "🔍 **Preview deploy** of the v2 redesign (this branch, real backend, not production): ${URL}"
          else
            echo "No open PR found for ${GITHUB_REF_NAME}; preview URL: ${URL}"
          fi
