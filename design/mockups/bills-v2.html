<title>Bills v2</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#E7E3DA;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,system-ui,sans-serif;-webkit-font-smoothing:antialiased;padding:24px}
  .stage{display:flex;gap:36px;justify-content:center;flex-wrap:wrap}
  .hm{--bg:#F6F2EA;--surface:#fff;--surface2:#F1ECE3;--border:rgba(20,24,32,.08);--fg1:#0F172A;--fg2:#64748B;--fg3:#94A3B8;--primary:#3B6FBF;--primary-tint:rgba(59,111,191,.1);--success:#2F8550;--danger:#B84540;--owed:linear-gradient(150deg,#4A84D0,#274F99);--owed-sh:rgba(41,82,160,.34)}
  .hm.dark{--bg:#0A0F1B;--surface:#151D2E;--surface2:#1F2940;--border:rgba(255,255,255,.08);--fg1:#EEF2F8;--fg2:#8A95AA;--fg3:#586279;--primary:#4E82D4;--primary-tint:rgba(78,130,212,.16);--success:#4FB071;--danger:#E5645F;--owed:linear-gradient(150deg,#264C8C,#182F5A);--owed-sh:rgba(20,44,90,.55)}
  .phone{width:344px;min-height:720px;border-radius:46px;position:relative;background:var(--bg);color:var(--fg1);overflow:hidden;box-shadow:0 30px 60px rgba(15,23,42,.22),0 0 0 1px rgba(15,23,42,.06)}
  .cap{text-align:center;font-size:12px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:#7a8494;margin-bottom:10px}
  .notch{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:108px;height:31px;border-radius:20px;background:#000;z-index:9}
  .scr{padding:60px 18px 20px}
  .h{display:flex;align-items:center;gap:10px;margin-bottom:16px}
  .h .back{width:38px;height:38px;border-radius:19px;border:1px solid var(--border);background:var(--surface);display:flex;align-items:center;justify-content:center;color:var(--fg1)}
  .h .t{font-size:20px;font-weight:800;letter-spacing:-.5px}
  .h .add{margin-left:auto;background:var(--primary);color:#fff;font-size:13px;font-weight:700;padding:9px 14px;border-radius:12px;display:flex;align-items:center;gap:5px}
  .bal{display:flex;border-radius:20px;padding:20px;background:var(--owed);box-shadow:0 12px 26px var(--owed-sh);margin-bottom:14px}
  .bal .st{flex:1;text-align:center}
  .bal .lb{font-size:12px;color:rgba(255,255,255,.75);font-weight:500}
  .bal .nm{font-size:22px;font-weight:800;letter-spacing:-.5px;margin-top:3px}
  .bal .tag{font-size:11px;font-weight:600;color:rgba(255,255,255,.75);margin-top:2px}
  .bal .dv{width:1px;height:52px;background:rgba(255,255,255,.22);align-self:center}
  .settle{border:1px solid color-mix(in srgb,var(--success) 40%,transparent);background:var(--surface);border-radius:16px;padding:14px 15px;display:flex;align-items:center;gap:10px;margin-bottom:16px}
  .settle .ic{width:34px;height:34px;border-radius:11px;background:color-mix(in srgb,var(--success) 15%,transparent);color:var(--success);display:flex;align-items:center;justify-content:center}
  .settle .tt{font-size:14px;font-weight:700}
  .settle .ss{font-size:12px;color:var(--fg2)}
  .tabs{display:flex;gap:8px;margin-bottom:14px}
  .tab{flex:1;text-align:center;padding:10px;border-radius:12px;font-size:13px;font-weight:700;color:var(--fg2);background:var(--surface2)}
  .tab.on{background:var(--primary);color:#fff}
  .grp{font-size:12px;font-weight:700;color:var(--fg3);text-transform:uppercase;letter-spacing:.4px;margin:6px 2px 10px}
  .row{display:flex;align-items:center;gap:11px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px;margin-bottom:10px}
  .row .ic{width:38px;height:38px;border-radius:11px;background:var(--primary-tint);color:var(--primary);display:flex;align-items:center;justify-content:center}
  .row .nm{font-size:14px;font-weight:700}
  .row .sb{font-size:12px;color:var(--fg2);margin-top:1px}
  .row .amt{margin-left:auto;font-size:15px;font-weight:800}
  svg{display:block}
</style>
<div class="stage">
  <div><div class="cap">Bills · Light</div><div class="phone hm"><div class="notch"></div><div class="scr" id="a"></div></div></div>
  <div><div class="cap">Bills · Dark</div><div class="phone hm dark"><div class="notch"></div><div class="scr" id="b"></div></div></div>
</div>
<template id="tpl">
  <div class="h">
    <div class="back"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></div>
    <div class="t">Bills & expenses</div>
    <div class="add"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Add</div>
  </div>
  <div class="bal">
    <div class="st"><div class="lb">Owed to you</div><div class="nm" style="color:#8FE0AC">₪792</div></div>
    <div class="dv"></div>
    <div class="st"><div class="lb">Net</div><div class="nm" style="color:#fff">+₪746</div><div class="tag">You're owed</div></div>
    <div class="dv"></div>
    <div class="st"><div class="lb">You owe</div><div class="nm" style="color:#FF8478">₪46</div></div>
  </div>
  <div class="settle">
    <div class="ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 6"/></svg></div>
    <div style="flex:1"><div class="tt">Settle up</div><div class="ss">2 people to square up with</div></div>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--fg3)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
  </div>
  <div class="tabs"><div class="tab on">One-off</div><div class="tab">Recurring</div></div>
  <div class="grp">Today</div>
  <div class="row"><div class="ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20" r="1.4"/><circle cx="17" cy="20" r="1.4"/><path d="M3 4h2l2.5 12h11l2-8H6"/></svg></div><div><div class="nm">Groceries</div><div class="sb">Alex · split 3 ways</div></div><div class="amt">₪134</div></div>
  <div class="row"><div class="ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M6 7l1 12h10l1-12"/></svg></div><div><div class="nm">Dinner out</div><div class="sb">Sam · split 2 ways</div></div><div class="amt">₪88</div></div>
  <div class="grp">Yesterday</div>
  <div class="row"><div class="ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11v2a1 1 0 001 1h2l8 5V5L6 10H4a1 1 0 00-1 1z"/></svg></div><div><div class="nm">Internet</div><div class="sb">Jordan · split 3 ways</div></div><div class="amt">₪120</div></div>
</template>
<script>
  const tpl=document.getElementById('tpl').content;
  document.getElementById('a').appendChild(tpl.cloneNode(true));
  document.getElementById('b').appendChild(tpl.cloneNode(true));
</script>
