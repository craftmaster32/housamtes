<title>Games v2</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="inter.css">
<link rel="stylesheet" href="displayfonts.css">
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#E7E3DA;color:#1b2431;font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;padding:30px 16px 50px}
  .head{text-align:center;max-width:860px;margin:0 auto 22px}
  .head h1{font-size:22px;font-weight:800;letter-spacing:-.5px;margin:0 0 8px}
  .head p{margin:0;color:#7a8494;font-size:14px}
  .stage{display:flex;gap:34px;justify-content:center;flex-wrap:wrap;max-width:1200px;margin:0 auto}
  .col{display:flex;flex-direction:column;align-items:center;gap:12px}
  .cap{font-size:12.5px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;color:#7a8494}
  .hm{--bg:#F6F2EA;--surface:#fff;--surface2:#F1ECE3;--border:rgba(20,24,32,.07);--fg1:#0F172A;--fg2:#64748B;--fg3:#98A2B3;--primary:#3B6FBF;--primary-tint:rgba(59,111,191,.1);--pos:#2F8550;--pos-tint:rgba(47,133,80,.14);--flame:#E8892B}
  .hm.dark{--bg:#0A0F1B;--surface:#141C2C;--surface2:#1E2840;--border:rgba(255,255,255,.07);--fg1:#EEF2F8;--fg2:#8A95AA;--fg3:#5A6479;--primary:#4E82D4;--primary-tint:rgba(78,130,212,.16);--pos:#4FB071;--pos-tint:rgba(79,176,113,.16);--flame:#E8A24B}
  .phone{width:344px;border-radius:46px;position:relative;background:var(--bg);color:var(--fg1);overflow:hidden;box-shadow:0 30px 60px rgba(15,23,42,.24),0 0 0 1px rgba(15,23,42,.06)}
  .notch{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:108px;height:31px;border-radius:20px;background:#000;z-index:9}
  .scr{padding:52px 18px 22px}
  .hdr{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .back{width:38px;height:38px;border-radius:19px;border:1px solid var(--border);background:var(--surface);display:flex;align-items:center;justify-content:center;color:var(--fg1)}
  .htitle{flex:1;text-align:center;font-family:'Fraunces',Georgia,serif;font-size:22px;font-weight:600;margin-right:38px}
  .tabs{display:flex;background:var(--surface2);border-radius:11px;padding:3px;margin-bottom:16px}
  .tab{flex:1;text-align:center;padding:9px;border-radius:9px;font-size:13px;font-weight:700;color:var(--fg2)}
  .tab.on{background:var(--surface);color:var(--primary);box-shadow:0 1px 3px rgba(0,0,0,.1)}
  /* scramble */
  .score{display:flex;background:var(--surface2);border-radius:14px;padding:12px;margin-bottom:16px}
  .sp{flex:1;text-align:center}
  .sl{font-size:10.5px;font-weight:700;color:var(--fg2);text-transform:uppercase;letter-spacing:.4px}
  .sv{font-size:19px;font-weight:800;margin-top:2px;display:flex;align-items:center;justify-content:center;gap:3px}
  .catpill{display:inline-flex;align-items:center;gap:6px;background:var(--primary-tint);color:var(--primary);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;padding:5px 12px;border-radius:9999px;margin:0 auto 16px}
  .catwrap{text-align:center}
  .tiles{display:flex;justify-content:center;gap:8px;margin-bottom:16px}
  .tile{width:44px;height:52px;border-radius:12px;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;color:var(--primary)}
  .hint{display:flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--border);border-radius:12px;padding:11px;color:var(--fg2);font-size:13px;font-weight:600;margin-bottom:14px}
  .inrow{display:flex;gap:9px;margin-bottom:12px}
  .in{flex:1;border:1px solid var(--border);background:var(--surface);border-radius:12px;padding:13px;font-size:16px;color:var(--fg3);letter-spacing:2px;font-weight:700}
  .sub{width:52px;border-radius:12px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center}
  .shuffle{display:flex;align-items:center;justify-content:center;gap:7px;background:var(--surface2);border-radius:12px;padding:11px;color:var(--fg2);font-size:13px;font-weight:700}
  .result{display:flex;align-items:center;gap:9px;border-radius:14px;padding:14px;margin-bottom:12px}
  .result.ok{background:var(--pos-tint);color:var(--pos)}
  .result .rt{font-size:15px;font-weight:800}
  /* joke */
  .jcard{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:18px;margin-bottom:14px}
  .jhead{display:flex;align-items:center;gap:10px;margin-bottom:13px}
  .sq{width:34px;height:34px;border-radius:11px;background:var(--primary-tint);color:var(--primary);display:flex;align-items:center;justify-content:center}
  .jpill{font-size:10.5px;font-weight:800;color:var(--primary);background:var(--primary-tint);padding:3px 10px;border-radius:9999px;text-transform:uppercase;letter-spacing:.3px}
  .jsetup{font-size:16px;font-weight:600;line-height:1.5;letter-spacing:-.2px}
  .jreveal{margin-top:14px;display:inline-flex;align-items:center;gap:6px;background:var(--primary);color:#fff;font-weight:700;font-size:13px;padding:9px 15px;border-radius:12px}
  .jnext{display:flex;align-items:center;justify-content:center;gap:7px;background:var(--surface2);border-radius:12px;padding:12px;color:var(--fg2);font-size:13px;font-weight:700}
  svg{display:block}
</style>
<div class="head"><h1>Games — v2</h1><p>Streak flame, hint, and result become line icons; category pills lose emoji; joke card matches the dashboard's. Fraunces title.</p></div>
<div class="stage" id="stage"></div>

<template id="scr">
  <div class="scr">
    <div class="hdr"><div class="back"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></div><div class="htitle">Games & fun</div></div>
    <div class="tabs"><div class="tab on">Word Scramble</div><div class="tab">Dad Jokes</div></div>
    <div class="score">
      <div class="sp"><div class="sl">Score</div><div class="sv" style="color:var(--primary)">40</div></div>
      <div class="sp"><div class="sl">Round</div><div class="sv">3</div></div>
      <div class="sp"><div class="sl">Streak</div><div class="sv" style="color:var(--flame)">4<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c1 3-1 5-2 6.5C8.5 10 8 11.5 8 13a4 4 0 108 0c0-2-1.5-4-1.5-6C15.8 8 17 10 17 13a5 5 0 11-10 0c0-4 3-6 5-11z"/></svg></div></div>
    </div>
    <div class="catwrap"><span class="catpill"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v16H4zM4 9h16M9 4v16"/></svg>Animals</span></div>
    <div class="tiles"><div class="tile">T</div><div class="tile">A</div><div class="tile">C</div></div>
    <div class="hint"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 22h4M12 2a7 7 0 00-4 12c1 1 1 2 1 3h6c0-1 0-2 1-3a7 7 0 00-4-12z"/></svg>A furry pet that says meow</div>
    <div class="inrow"><div class="in">CAT</div><div class="sub"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 6"/></svg></div></div>
    <div class="shuffle"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>Shuffle letters</div>
  </div>
</template>

<template id="scrRes">
  <div class="scr">
    <div class="hdr"><div class="back"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></div><div class="htitle">Games & fun</div></div>
    <div class="tabs"><div class="tab on">Word Scramble</div><div class="tab">Dad Jokes</div></div>
    <div class="score">
      <div class="sp"><div class="sl">Score</div><div class="sv" style="color:var(--primary)">50</div></div>
      <div class="sp"><div class="sl">Round</div><div class="sv">3</div></div>
      <div class="sp"><div class="sl">Streak</div><div class="sv" style="color:var(--flame)">5<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c1 3-1 5-2 6.5C8.5 10 8 11.5 8 13a4 4 0 108 0c0-2-1.5-4-1.5-6C15.8 8 17 10 17 13a5 5 0 11-10 0c0-4 3-6 5-11z"/></svg></div></div>
    </div>
    <div class="catwrap"><span class="catpill"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v16H4zM4 9h16M9 4v16"/></svg>Animals</span></div>
    <div class="tiles"><div class="tile">C</div><div class="tile">A</div><div class="tile">T</div></div>
    <div class="result ok"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/></svg><div class="rt">Correct! +10 points</div></div>
    <div class="shuffle" style="background:var(--primary);color:#fff">Next word</div>
  </div>
</template>

<template id="joke">
  <div class="scr">
    <div class="hdr"><div class="back"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></div><div class="htitle">Games & fun</div></div>
    <div class="tabs"><div class="tab">Word Scramble</div><div class="tab on">Dad Jokes</div></div>
    <div class="jcard">
      <div class="jhead"><div class="sq"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 14.5a4 4 0 007 0"/><path d="M9 9.5h.01M15 9.5h.01"/></svg></div><span class="jpill">bills</span></div>
      <div class="jsetup">Why did the housemate bring a ladder to pay rent?</div>
      <div class="jreveal">Tap to reveal<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></div>
    </div>
    <div class="jnext"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 019-9 9 9 0 016.7 3M21 3v5h-5M21 12a9 9 0 01-9 9 9 9 0 01-6.7-3M3 21v-5h5"/></svg>Another one</div>
  </div>
</template>

<script>
  const s=document.getElementById('stage');
  function ph(id,cls,cap){const col=document.createElement('div');col.className='col';const c=document.createElement('div');c.className='cap';c.textContent=cap;const p=document.createElement('div');p.className='phone hm'+(cls?' '+cls:'');p.innerHTML='<div class="notch"></div>'+document.getElementById(id).innerHTML;col.appendChild(c);col.appendChild(p);s.appendChild(col);}
  ph('scr','','Scramble · Light');
  ph('scrRes','dark','Scramble · correct (Dark)');
  ph('joke','','Dad Jokes');
</script>
