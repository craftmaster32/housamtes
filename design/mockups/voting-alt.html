<title>Voting alternatives</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="inter.css">
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#E7E3DA;color:#1b2431;font-family:'Inter',-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased;padding:30px 16px 50px}
  .head{text-align:center;max-width:820px;margin:0 auto 22px}
  .head h1{font-size:22px;font-weight:800;letter-spacing:-.5px;margin:0 0 8px}
  .head p{margin:0;color:#7a8494;font-size:14px}
  .stage{display:flex;gap:40px;justify-content:center;flex-wrap:wrap}
  .col{display:flex;flex-direction:column;align-items:center;gap:12px}
  .cap{font-size:12.5px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;color:#7a8494;text-align:center;max-width:344px}
  .cap small{display:block;font-weight:500;text-transform:none;letter-spacing:0;color:#9aa2ae;margin-top:3px;font-size:12px}
  .hm{--bg:#F6F2EA;--surface:#fff;--surface2:#F1ECE3;--border:rgba(20,24,32,.07);--fg1:#0F172A;--fg2:#64748B;--fg3:#98A2B3;--primary:#3B6FBF;--primary-tint:rgba(59,111,191,.1);--pos:#2F8550;--pos-tint:rgba(47,133,80,.14);--neg:#B84540;--neg-tint:rgba(184,69,64,.12)}
  .phone{width:344px;border-radius:46px;position:relative;background:var(--bg);color:var(--fg1);overflow:hidden;box-shadow:0 30px 60px rgba(15,23,42,.24),0 0 0 1px rgba(15,23,42,.06)}
  .notch{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:108px;height:31px;border-radius:20px;background:#000;z-index:9}
  .scr{padding:56px 18px 22px}
  .title{font-size:24px;font-weight:800;letter-spacing:-.6px}
  .sub{font-size:13px;color:var(--fg2);font-weight:500;margin:2px 0 16px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:16px;margin-bottom:14px}
  .ch{display:flex;align-items:flex-start;gap:10px;margin-bottom:12px}
  .cn{font-size:16px;font-weight:800;letter-spacing:-.3px;flex:1}
  .badge{font-size:10px;font-weight:800;padding:3px 9px;border-radius:9999px;text-transform:uppercase;letter-spacing:.4px;color:var(--primary);background:var(--primary-tint)}
  .cm{font-size:12px;color:var(--fg2);font-weight:500;margin-bottom:14px}
  .av{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff;border:2px solid var(--surface)}

  /* Concept A — segmented tap-to-vote pill */
  .seg{display:flex;height:64px;border-radius:16px;overflow:hidden;border:1px solid var(--border);margin-bottom:14px}
  .seg .side{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative}
  .seg .yes{background:var(--pos);color:#fff}
  .seg .no{background:var(--neg-tint);color:var(--neg)}
  .seg .k{font-size:22px;font-weight:800;line-height:1}
  .seg .l{font-size:11px;font-weight:700;display:flex;align-items:center;gap:4px}
  .seg .yourtag{position:absolute;top:6px;font-size:8.5px;font-weight:800;letter-spacing:.4px;opacity:.85}
  .faces{display:flex;align-items:center}
  .faces .av{margin-left:-8px}.faces .av:first-child{margin-left:0}
  .facerow{display:flex;align-items:center;gap:10px}
  .facerow .lbl{font-size:11.5px;color:var(--fg2);font-weight:600}

  /* Concept B — poll rows with avatars on the fill */
  .poll{display:flex;flex-direction:column;gap:10px}
  .pr{position:relative;height:46px;border-radius:12px;background:var(--surface2);overflow:hidden;display:flex;align-items:center}
  .pr .fill{position:absolute;left:0;top:0;bottom:0;border-radius:12px}
  .pr.y .fill{background:var(--pos-tint)}
  .pr.n .fill{background:var(--neg-tint)}
  .pr .content{position:relative;display:flex;align-items:center;gap:8px;padding:0 12px;width:100%}
  .pr .ico{width:24px;height:24px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none}
  .pr.y .ico{background:var(--pos);color:#fff}.pr.n .ico{background:var(--neg);color:#fff}
  .pr .opt{font-size:14px;font-weight:800}
  .pr.y .opt{color:var(--pos)}.pr.n .opt{color:var(--neg)}
  .pr .faces2{display:flex;margin-left:8px}
  .pr .faces2 .av{width:22px;height:22px;font-size:9px;margin-left:-7px}
  .pr .faces2 .av:first-child{margin-left:0}
  .pr .cnt{margin-left:auto;font-size:14px;font-weight:800}
  .pr.y .cnt{color:var(--pos)}.pr.n .cnt{color:var(--neg)}
  .pr .chk{margin-left:6px;flex:none}
  .waiting{display:flex;align-items:center;gap:7px;margin-top:11px;font-size:11.5px;color:var(--fg2);font-weight:600}
  svg{display:block}
</style>
<div class="head"><h1>Voting — two other directions</h1><p>Each one merges the tally bar + vote buttons + voter list into a single control, and shows who voted with faces (not a text list).</p></div>
<div class="stage" id="stage"></div>

<template id="A">
  <div class="scr">
    <div class="title">House votes</div>
    <div class="sub">Tap your side to vote — it fills to the result.</div>
    <div class="card">
      <div class="ch"><div class="cn">Buy a new vacuum</div><span class="badge">Open</span></div>
      <div class="cm">Alex · 2 days ago · ₪100 each</div>
      <div class="seg">
        <div class="side yes" style="flex:2"><span class="yourtag">YOUR VOTE</span><span class="k">2</span><span class="l"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 6"/></svg>Yes</span></div>
        <div class="side no" style="flex:1"><span class="k">1</span><span class="l">No</span></div>
      </div>
      <div class="facerow">
        <div class="faces">
          <div class="av" style="background:#3B6FBF">A</div>
          <div class="av" style="background:#8A5CD0">S</div>
          <div class="av" style="background:#C77">J</div>
        </div>
        <span class="lbl">Everyone voted · 2 Yes, 1 No</span>
      </div>
    </div>
    <div class="card" style="opacity:.7">
      <div class="ch"><div class="cn">Quiet hours after 11pm</div><span class="badge" style="color:var(--pos);background:var(--pos-tint)">Passed</span></div>
      <div class="seg" style="height:44px"><div class="side yes" style="flex:1"><span class="k" style="font-size:17px">3</span></div><div class="side no" style="flex:0 0 46px;background:var(--surface2);color:var(--fg3)"><span class="k" style="font-size:17px">0</span></div></div>
    </div>
  </div>
</template>

<template id="B">
  <div class="scr">
    <div class="title">House votes</div>
    <div class="sub">Tap a bar — faces show who's on each side.</div>
    <div class="card">
      <div class="ch"><div class="cn">Buy a new vacuum</div><span class="badge">Open</span></div>
      <div class="cm">Alex · 2 days ago · ₪100 each</div>
      <div class="poll">
        <div class="pr y">
          <div class="fill" style="width:66%"></div>
          <div class="content">
            <div class="ico"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 6"/></svg></div>
            <span class="opt">Yes</span>
            <div class="faces2"><div class="av" style="background:#3B6FBF">A</div><div class="av" style="background:#8A5CD0">S</div></div>
            <span class="cnt">2</span>
            <svg class="chk" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--pos)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 6"/></svg>
          </div>
        </div>
        <div class="pr n">
          <div class="fill" style="width:34%"></div>
          <div class="content">
            <div class="ico"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg></div>
            <span class="opt">No</span>
            <div class="faces2"><div class="av" style="background:#C77">J</div></div>
            <span class="cnt">1</span>
          </div>
        </div>
      </div>
      <div class="waiting"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Everyone has voted</div>
    </div>
    <div class="card" style="opacity:.7">
      <div class="ch"><div class="cn">Quiet hours after 11pm</div><span class="badge" style="color:var(--pos);background:var(--pos-tint)">Passed</span></div>
      <div class="poll"><div class="pr y"><div class="fill" style="width:100%"></div><div class="content"><div class="ico"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 6"/></svg></div><span class="opt">Yes</span><span class="cnt">3</span></div></div></div>
    </div>
  </div>
</template>

<script>
  const s=document.getElementById('stage');
  function ph(id,cap,sub){const col=document.createElement('div');col.className='col';const c=document.createElement('div');c.className='cap';c.innerHTML=cap+'<small>'+sub+'</small>';const p=document.createElement('div');p.className='phone hm';p.innerHTML='<div class="notch"></div>'+document.getElementById(id).innerHTML;col.appendChild(c);col.appendChild(p);s.appendChild(col);}
  ph('A','Concept A — one vote pill','Yes/No is a single split button that also IS the tally');
  ph('B','Concept B — poll bars','Two tappable bars; faces sit on each side');
</script>
