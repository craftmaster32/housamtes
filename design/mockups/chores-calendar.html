<title>Chores + Calendar v2</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#E7E3DA;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,system-ui,sans-serif;-webkit-font-smoothing:antialiased;padding:26px 20px}
  .stage{display:flex;gap:36px;justify-content:center;flex-wrap:wrap}
  .cap{text-align:center;font-size:12px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:#7a8494;margin-bottom:10px}
  .hm{--bg:#F6F2EA;--surface:#fff;--surface2:#F1ECE3;--border:rgba(20,24,32,.08);--fg1:#0F172A;--fg2:#64748B;--fg3:#94A3B8;--primary:#3B6FBF;--primary-tint:rgba(59,111,191,.12);--success:#2F8550;--sg1:#3AA968;--sg2:#248049}
  .hm.dark{--bg:#0A0F1B;--surface:#151D2E;--surface2:#1F2940;--border:rgba(255,255,255,.08);--fg1:#EEF2F8;--fg2:#8A95AA;--fg3:#586279;--primary:#4E82D4;--primary-tint:rgba(78,130,212,.18);--success:#4FB071;--sg1:#2F9160;--sg2:#1C6E45}
  .phone{width:344px;min-height:660px;border-radius:46px;position:relative;background:var(--bg);color:var(--fg1);overflow:hidden;box-shadow:0 30px 60px rgba(15,23,42,.2),0 0 0 1px rgba(15,23,42,.06)}
  .notch{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:108px;height:31px;border-radius:20px;background:#000;z-index:9}
  .scr{padding:58px 18px 22px}
  .title{font-size:22px;font-weight:800;letter-spacing:-.5px;margin-bottom:14px}
  /* chores hero */
  .phero{border-radius:18px;padding:18px;background:linear-gradient(150deg,var(--sg1),var(--sg2));box-shadow:0 10px 22px color-mix(in srgb,var(--sg2) 35%,transparent);margin-bottom:14px}
  .phero .top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .phero .num{font-size:30px;font-weight:800;letter-spacing:-.8px;color:#fff}
  .phero .num small{font-size:18px;color:rgba(255,255,255,.7)}
  .phero .lab{flex:1;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:rgba(255,255,255,.85)}
  .phero .rst{background:rgba(255,255,255,.18);color:#fff;font-size:12px;font-weight:700;padding:6px 12px;border-radius:9999px}
  .phero .track{height:6px;border-radius:3px;background:rgba(255,255,255,.25);overflow:hidden}
  .phero .track>i{display:block;height:100%;background:#fff;border-radius:3px}
  .addrow{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:6px 6px 6px 14px;margin-bottom:14px}
  .addrow .i{flex:1;font-size:15px;color:var(--fg3)}
  .addrow .go{width:40px;height:40px;border-radius:11px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center}
  .crow{display:flex;align-items:center;gap:11px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:13px;margin-bottom:9px}
  .crow.done{background:var(--surface2);border-color:transparent}
  .ck{width:24px;height:24px;border-radius:12px;border:1.8px solid var(--border);flex:none;display:flex;align-items:center;justify-content:center}
  .ck.on{background:var(--success);border-color:var(--success)}
  .cn{flex:1;font-size:15px;font-weight:600}.cn.done{color:var(--fg3);text-decoration:line-through}
  .who{font-size:12px;color:var(--fg2);background:var(--surface2);padding:2px 9px;border-radius:9px;font-weight:600}
  /* calendar */
  .mhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .mhead .m{font-size:17px;font-weight:800}
  .nav{width:36px;height:36px;border-radius:10px;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--fg1)}
  .dow{display:flex;margin-bottom:4px}.dow span{flex:1;text-align:center;font-size:11px;font-weight:700;color:var(--fg3)}
  .grid{display:flex;flex-wrap:wrap}
  .cell{width:calc(100%/7);min-height:50px;display:flex;flex-direction:column;align-items:center;padding-top:3px}
  .dn{width:26px;height:26px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:var(--fg1)}
  .dn.today{background:var(--primary-tint);color:var(--primary);font-weight:800}
  .dn.sel{background:var(--primary);color:#fff;font-weight:800}
  .dn.faint{color:var(--fg3)}
  .chip{margin-top:2px;font-size:8px;font-weight:700;color:#fff;border-radius:3px;padding:0 3px;line-height:12px;max-width:90%;overflow:hidden;white-space:nowrap}
  .legend{display:flex;flex-wrap:wrap;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px;margin-top:12px}
  .li{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--fg2);font-weight:600}
  .ld{width:8px;height:8px;border-radius:4px}
  svg{display:block}
</style>
<div class="stage">
  <div><div class="cap">Chores · Light</div><div class="phone hm"><div class="notch"></div><div class="scr">
    <div class="title">Chores</div>
    <div class="phero">
      <div class="top"><div class="num">12<small>/15</small></div><div class="lab">done</div><div class="rst">Reset all</div></div>
      <div class="track"><i style="width:80%"></i></div>
    </div>
    <div class="addrow"><span class="i">Add a chore…</span><div class="go"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></div></div>
    <div class="crow"><div class="ck"></div><div class="cn">Take out the bins</div><span class="who">You</span></div>
    <div class="crow"><div class="ck"></div><div class="cn">Vacuum living room</div><span class="who">Sam</span></div>
    <div class="crow done"><div class="ck on"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 6"/></svg></div><div class="cn done">Clean kitchen</div><span class="who">Jordan</span></div>
  </div></div></div>

  <div><div class="cap">Chores · Dark</div><div class="phone hm dark"><div class="notch"></div><div class="scr">
    <div class="title">Chores</div>
    <div class="phero">
      <div class="top"><div class="num">3<small>/15</small></div><div class="lab">done</div></div>
      <div class="track"><i style="width:20%"></i></div>
    </div>
    <div class="addrow"><span class="i">Add a chore…</span><div class="go"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></div></div>
    <div class="crow"><div class="ck"></div><div class="cn">Take out the bins</div><span class="who">You</span></div>
    <div class="crow"><div class="ck"></div><div class="cn">Water the plants</div><span class="who">Sam</span></div>
  </div></div></div>

  <div><div class="cap">Calendar · Dark</div><div class="phone hm dark"><div class="notch"></div><div class="scr">
    <div class="title">Calendar</div>
    <div class="mhead"><div class="nav"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></div><div class="m">July 2026</div><div class="nav"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></div></div>
    <div class="dow"><span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span></div>
    <div class="grid" id="cal"></div>
    <div class="legend"><div class="li"><span class="ld" style="background:#6366f1"></span>Events</div><div class="li"><span class="ld" style="background:#f59e0b"></span>Parking</div><div class="li"><span class="ld" style="background:#ef4444"></span>Bills</div><div class="li"><span class="ld" style="background:#22c55e"></span>Chores</div></div>
  </div></div></div>
</div>
<script>
  const cal=document.getElementById('cal'); let h='';
  for(let i=0;i<2;i++) h+='<div class="cell"><div class="dn faint">'+(29+i)+'</div></div>';
  for(let d=1; d<=31; d++){
    let cls='dn'; if(d===20)cls='dn today'; if(d===24)cls='dn sel';
    let chip=''; if(d===18)chip='<div class="chip" style="background:#6366f1">Dinner</div>'; if(d===22)chip='<div class="chip" style="background:#f59e0b">Parking</div>'; if(d===24)chip='<div class="chip" style="background:#ef4444">Rent</div>';
    h+='<div class="cell"><div class="'+cls+'">'+d+'</div>'+chip+'</div>';
  }
  cal.innerHTML=h;
</script>
